# Builds Lingo Lock on every push to main and publishes it as a GitHub release named "build-<N>"
# (N = number of commits, the app's build number): the phone app (lingo-lock.apk), then the Mac app
# (lingo-lock-mac.zip). Both find the newest release and update themselves - no cable needed.
#
# One-time setup: run tools\setup-cloud-builds.ps1 on the PC. It stores your signing key as
# encrypted repository secrets, so these builds install over the app without losing progress.
# Until then this workflow skips the build.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    steps:
      - name: Check for the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing key yet - run tools/setup-cloud-builds.ps1 once to publish builds for the phone."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.ready == 'true'
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v5
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.key.outputs.ready == 'true'

      - name: Build (unit tests + signed release APK)
        if: steps.key.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hanzilock.jks
          {
            echo "storeFile=keystore/hanzilock.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :app:assembleRelease --console=plain
          rm -rf keystore

      - name: Publish the release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(git rev-list --count HEAD)
          tag="build-$build"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk lingo-lock.apk
          git log -1 --pretty=%B > notes.txt
          gh release create "$tag" lingo-lock.apk --title "Build $build" --notes-file notes.txt --target "$GITHUB_SHA"
          # Keep the 5 newest builds (each APK is about 45 MB).
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 |
            xargs -r -n 1 gh release delete --cleanup-tag --yes

  # The Mac app, added to the same release. It needs no secrets: it is signed ad hoc (no Apple
  # Developer account), so the first launch needs "Open Anyway" once (README, "Lingo Lock on the Mac").
  mac:
    needs: release
    if: needs.release.outputs.ready == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the speech helper
        run: sh macos/lingo-helper/build.sh

      - name: Build the Mac app (unit tests + Lingo Lock.app)
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest :desktop:createDistributable --console=plain

      - name: Sign ad hoc and zip
        run: |
          app="desktop/build/compose/binaries/main/app/Lingo Lock.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" lingo-lock-mac.zip

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(git rev-list --count HEAD)
          gh release upload "build-$build" lingo-lock-mac.zip --clobber
