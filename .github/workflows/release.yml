# Builds Lingo Lock on every push to main and publishes it as a GitHub release named "build-<N>"
# (N = number of commits, the app's build number). The app on the phone finds the newest release
# and updates itself - no cable or computer needed.
#
# One-time setup: run tools\setup-cloud-builds.ps1 on the PC. It stores your signing key as
# encrypted repository secrets, so these builds install over the app without losing progress.
# Until then this workflow skips the build.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing key yet - run tools/setup-cloud-builds.ps1 once to publish builds for the phone."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.ready == 'true'

      - name: Build (unit tests + signed release APK)
        if: steps.key.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hanzilock.jks
          {
            echo "storeFile=keystore/hanzilock.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
          rm -rf keystore

      - name: Publish the release
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(git rev-list --count HEAD)
          tag="build-$build"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk lingo-lock.apk
          git log -1 --pretty=%B > notes.txt
          gh release create "$tag" lingo-lock.apk --title "Build $build" --notes-file notes.txt --target "$GITHUB_SHA"
          # Keep the 5 newest builds (each APK is about 45 MB).
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 |
            xargs -r -n 1 gh release delete --cleanup-tag --yes
